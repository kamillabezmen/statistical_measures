<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Все расчёты</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="/static/styles/style.css">
</head>

<body>

<div class="app">

    <main class="tiles-page">

        <div class="tiles-header">
            <h1>Все расчёты</h1>
        </div>


        <!--поиск -->
        <form
            class="filter-form"
            method="GET"
            action="/statistical-measures"
        >

            <label for="time">
                Время расчёта
            </label>

            <div class="filter-row">

                <input
                    class="filter-input"
                    type="number"
                    id="time"
                    name="time"
                    min="0"
                    value="{{ .time }}"
                >

                <button
                    class="filter-button"
                    type="submit"
                >
                    Найти
                </button>

            </div>

        </form>


        <!-- плитка -->
        <div class="tiles-grid">

            {{ range .measures }}

            <div class="measure-card">

                <a
                    href="/feed-statistical-measures?id={{ .ID }}"
                    style="text-decoration: none; color: inherit;"
                >

                    <div class="card-image">

                        <img
                            src="{{ .ImageURL }}"
                            alt="{{ .Title }}"
                            class="tile-image"
                            loading="lazy"
                            onerror="this.onerror=null; this.src='/static/images/default-image.png';"
                        >

                    </div>


                    <div class="card-content">

                        <div class="card-likes">

                            <span class="card-heart">
                                ♡
                            </span>

                            <span>
                                {{ .LikesCount }}
                            </span>

                        </div>


                        <h2>
                            {{ .Title }}
                        </h2>


                        <p class="card-description">
                            {{ .Description }}
                        </p>


                        <div class="card-time">
                            Время расчёта: {{ .CalculationTime }}
                        </div>

                    </div>

                </a>


                <!-- логическое удаление -->
                <form
                   class="delete-form"
                   method="POST"
                   action="/delete-statistical-measures"
                >
                   <input
                      type="hidden"
                      name="id"
                      value="{{ .ID }}"
                   >

                   <button
                      class="delete-button"
                      type="submit"
                   >
                        Удалить
                   </button>
                </form>

            </div>

            {{ end }}

        </div>

    </main>


    <nav class="bottom-nav">

        <a
            class="nav-item"
            href="/feed-statistical-measures?id=1"
        >
            <span class="nav-icon">▤</span>
            <span>Лента</span>
        </a>

        <a
            class="nav-item"
            href="/add-statistical-measures"
        >
            <span class="nav-icon">＋</span>
            <span>Добавить</span>
        </a>

        <a
            class="nav-item active"
            href="/statistical-measures"
        >
            <span class="nav-icon">▦</span>
            <span>Плитка</span>
        </a>

    </nav>

</div>

</body>
</html>
